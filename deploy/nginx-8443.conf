# JamWeb behind nginx with TLS.
#
# Drop this into /etc/nginx/conf.d/jamweb.conf on OpenWrt (or the equivalent
# sites-enabled directory elsewhere), adjust the certificate paths, then run
#   nginx -t -c /etc/nginx/uci.conf && nginx -s reload -c /etc/nginx/uci.conf
#
# The CMS keeps serving plain HTTP on 127.0.0.1:8080; nginx terminates TLS on
# 8443 and forwards. X-Forwarded-Proto makes the app mark its session cookie
# Secure.

server {
    listen 8443 ssl;
    server_name _;

    # OpenWrt's LuCI self-signed certificate, or your ACME certificate.
    ssl_certificate     /etc/nginx/conf.d/_lan.crt;
    ssl_certificate_key /etc/nginx/conf.d/_lan.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
